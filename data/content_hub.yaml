        date: "9999-98"
        when: "Ongoing"
        venue: "Microsoft Learn"
        summary: "A module on pairing with Copilot in Python: writing prompts that work, reviewing what it suggests, and knowing when to push back."

      - title: "Alliance Girls High School Software Engineering Program"
        url: "https://github.com/BethanyJep/HS-Software-Engineering"
        date: "2026-08"
        when: "Aug 2026"
        venue: "with TOFA and Alliance Girls Alumni"
        summary: "A project-based software engineering program for Grade 10 students. Term 2 covers foundations, careers and resources; Term 3 is a group project sprint ending in a showcase. Includes a facilitator guide, icebreakers, demos, and beginner career-path guides."

