{{ $id := .Get 0 }}
{{ $ratio := .Get "ratio" | default "1.33333333333333" }}
{{ $padding := printf "%.6f%%" (mul (div 1 (float $ratio)) 100) }}

<div class="speakerdeck-embed" style="margin: 2rem 0;">
  <div style="position: relative; width: 100%; height: 0; padding-bottom: {{ $padding }}; border-radius: 6px; box-shadow: 0 5px 40px rgba(0,0,0,0.2); background: #f8f9fa;">
    <iframe src="https://speakerdeck.com/player/{{ $id }}"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; border-radius: 6px;"
            allowfullscreen
            scrolling="no"
            allow="encrypted-media"
            title="Speaker Deck Presentation">
      Your browser does not support iframes. You can view the presentation on <a href="https://speakerdeck.com/{{ $id }}" target="_blank" rel="noopener noreferrer">Speaker Deck</a>.
    </iframe>
  </div>
  <div style="margin-top: 1rem; text-align: center; font-size: 0.875rem; color: #666;">
    <a href="https://speakerdeck.com/{{ $id }}"
       target="_blank"
       rel="noopener noreferrer"
       style="color: #0078d4; text-decoration: none; font-weight: 500;">
      View on Speaker Deck →
    </a>
  </div>
</div>
