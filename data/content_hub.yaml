  - id: workshops
    title: "Workshops and labs"
    blurb: "Hands-on sessions I have written or delivered, most built to be run at your own pace."
    items:
      - title: "Biashara Agent Workshop"
        url: "https://github.com/BethanyJep/Safaricom-Decode-Agents-Workshop"
        date: "2026-07"
        when: "Jul 2026"
        venue: "Safaricom Decode"
        summary: "Build a bilingual English and Swahili AI agent for a Nairobi restaurant using the Microsoft Foundry Toolkit in VS Code. Covers agent setup, system prompts, MCP tools for grounded answers, evaluation, a Flask chat interface, and exporting to production code with Microsoft Agent Framework."

      - title: "Foundry Toolkit and Hosted Agents Workshop"
        url: "https://github.com/microsoft-foundry/Foundry_Toolkit_for_VSCode_Lab"
        date: "2026-06"
        when: "Jun 2026"
        venue: "Microsoft Foundry"
        summary: "Build, test, and deploy single-agent and multi-agent Hosted Agents to Microsoft Foundry from VS Code, using the Foundry Toolkit and Microsoft Agent Framework in Python."

      - title: "LAB521: Improving Agent Behavior Using Reinforcement Learning from Traces"
        url: "https://github.com/microsoft/Build26-LAB521-improving-agent-behavior-using-reinforcement-learning-from-traces"
        date: "2026-05"
        when: "May 2026"
        venue: "Microsoft Build 2026"
        summary: "Agents often work, but prompts alone make their behaviour hard to control. This lab starts with a working agent, inspects its execution traces, defines good behaviour using evaluation graders, and applies reinforcement fine-tuning to reinforce better decisions without redesigning the agent."

      - title: "BRK441: Build and Launch AI Agents Fast with Foundry Toolkit for VS Code"
        url: "https://github.com/microsoft/aitour26-BRK441-Build-and-launch-AI-agents-fast-with-Foundry-Toolkit-for-VS-Code"
        date: "2026-04"
        when: "AI Tour 2025/26"
        venue: "Microsoft AI Tour"
        summary: "Prototype with open models in the Foundry Toolkit Playground, iterate on prompts in Agent Builder, evaluate against a test dataset, then take the same work from prototype to a deployed, monitored agent."

      - title: "BRK443: Efficient Model Customization with Microsoft Foundry"
        url: "https://github.com/microsoft/aitour26-BRK443-efficient-model-customization-with-microsoft-foundry"
        date: "2026-03"
        when: "AI Tour 2025/26"
        venue: "Microsoft AI Tour"
        summary: "When does fine-tuning actually make sense? This session walks through the customization options in Microsoft Foundry, then gets hands-on with synthetic data generation, distillation for cutting cost, and SFT for shaping tone."

      - title: "PREL13: Observe, Manage and Scale Agentic AI Apps with Microsoft Foundry"
        url: "https://github.com/microsoft/ignite25-PREL13-observe-manage-and-scale-agentic-ai-apps-with-microsoft-foundry"
        date: "2025-11"
        when: "Nov 2025"
        venue: "Microsoft Ignite 2025"
        summary: "An end-to-end lab on taking an agentic app past the demo stage: instrumenting it, watching what it actually does in production, and scaling it with Microsoft Foundry."

      - title: "Analyzing Snapshot Serengeti data with Microsoft Fabric"
        url: "https://moaw.dev/workshop/fabric-e2e-serengeti/"
        date: "2023-08"
        when: "2023"
        venue: "Microsoft Open Awesome Workshops"
        summary: "A self-paced workshop using camera trap data from the Serengeti: load it into a Lakehouse, query the SQL endpoint, visualize in Power BI, then transform and analyze the images with Apache Spark in Fabric."

